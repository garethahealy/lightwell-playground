name: Setup lightwell-skills
description: Run make skills and set LIGHTWELL_SKILLS

inputs:
  ref:
    description: Git ref of garethahealy/lightwell-skills
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Vendor lightwell skills
      shell: bash
      run: |
        set -euo pipefail
        make skills LIGHTWELL_SKILLS_REF="${{ inputs.ref }}"
        skills="${GITHUB_WORKSPACE}/.cursor/skills"
        if [[ ! -d "${skills}" ]]; then
          echo "make skills missing ${skills}" >&2
          exit 1
        fi
        echo "LIGHTWELL_SKILLS=${skills}" >> "${GITHUB_ENV}"
