name: Upgrade Directs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pom.xml"
      - ".m2/settings.xml"
      - ".github/workflows/upgrade-directs.yaml"
      - ".github/actions/setup-lightwell-skills/**"

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-directs:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup lightwell-skills
        uses: ./.github/actions/setup-lightwell-skills

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: 25
          cache: "maven"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Plan
        run: |
          set -euo pipefail
          python3 "${LIGHTWELL_SKILLS}/upgrade-directs/scripts/plan.py" \
            --pom pom.xml -o /tmp/direct-plan.json

      - name: Collect
        env:
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
        run: |
          set -euo pipefail
          python3 "${LIGHTWELL_SKILLS}/upgrade-directs/scripts/collect.py" \
            --from-plan /tmp/direct-plan.json \
            -o /tmp/direct-collect.json

      - name: Apply
        id: apply
        env:
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
        run: |
          set -euo pipefail
          python3 "${LIGHTWELL_SKILLS}/upgrade-directs/scripts/apply.py" \
            --from-collect /tmp/direct-collect.json \
            --include-ask \
            -o /tmp/direct-apply.json

      - name: Summary
        env:
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
        run: |
          set -euo pipefail
          python3 "${LIGHTWELL_SKILLS}/upgrade-directs/scripts/summary.py" \
            --from-collect /tmp/direct-collect.json \
            --from-apply /tmp/direct-apply.json \
            -o /tmp/direct-summary.md

          cat /tmp/direct-summary.md

      - name: Show updated pom.xml
        if: always() && steps.apply.outcome == 'success'
        run: cat pom.xml
