name: Add OSV to Renovate PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  comment-osv:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Comment OSV summaries on Renovate PRs
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
        run: |
          set -euo pipefail
          helper=".cursor/skills/add-osv-to-renovate/scripts/process-renovate-prs.sh"
          args=()

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            args+=(--pr "${{ github.event.pull_request.number }}")
          fi

          "$helper" "${args[@]}"
