name: Add OSV to Renovate PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment-osv:
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup lightwell-skills
        uses: ./.github/actions/setup-lightwell-skills

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Comment OSV summaries on Renovate PRs
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
        run: |
          set -euo pipefail
          "${LIGHTWELL_SKILLS}/add-osv-to-renovate/scripts/process-renovate-prs.sh" \
            --pr "${{ github.event.pull_request.number }}"
