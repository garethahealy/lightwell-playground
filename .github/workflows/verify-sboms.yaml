name: Verify SBOMs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pom.xml"
      - ".m2/settings.xml"
      - ".github/workflows/verify-sboms.yaml"
      - ".github/actions/setup-lightwell-skills/**"
      - "Makefile"

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-sboms:
    runs-on: ubuntu-latest
    env:
      LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
      LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
      LIGHTWELL_CLIENT_ID: ${{ secrets.LIGHTWELL_CLIENT_ID }}
      LIGHTWELL_CLIENT_SECRET: ${{ secrets.LIGHTWELL_CLIENT_SECRET }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup lightwell-skills
        uses: ./.github/actions/setup-lightwell-skills

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: 25
          cache: "maven"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Build
        run: mvn clean install --batch-mode --settings=.m2/settings.xml

      - name: Verify Lightwell SBOMs
        run: |
          set -euo pipefail
          shared="${LIGHTWELL_SKILLS}/lightwell-shared/scripts"
          coords="$(python3 "${shared}/coords_from_pom.py" --pom pom.xml)"
          if [[ -z "${coords}" ]]; then
            echo "No Lightwell jars to verify in pom.xml"
            exit 0
          fi
          bash "${shared}/verify-sboms.sh" --pom pom.xml
