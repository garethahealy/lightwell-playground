name: Verify Attestations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".cursor/skills/**"
      - ".github/workflows/verify-attestations.yaml"

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-attestations:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: 25
          cache: "maven"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build
        env:
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
        run: mvn clean install --batch-mode --settings=.m2/settings.xml

      - name: Verify Lightwell jars
        env:
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
        run: |
          set -euo pipefail
          coords="$(python3 .cursor/skills/lightwell-shared/scripts/coords_from_pom.py --pom pom.xml)"
          if [[ -z "${coords}" ]]; then
            echo "No Lightwell jars to verify in pom.xml"
            exit 0
          fi
          printf '%s\n' "${coords}" \
            | bash .cursor/skills/lightwell-shared/scripts/verify-attestations.sh --batch
