name: Upgrade Transitives

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pom.xml"
      - ".m2/settings.xml"
      - ".github/workflows/upgrade-transitives.yaml"
      - ".github/actions/setup-lightwell-skills/**"
      - "Makefile"

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-transitives:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup lightwell-skills
        uses: ./.github/actions/setup-lightwell-skills

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: 25
          cache: "maven"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Plan
        env:
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
        run: |
          set -euo pipefail
          python3 "${LIGHTWELL_SKILLS}/upgrade-transitives/scripts/plan.py" \
            --pom pom.xml --settings=.m2/settings.xml \
            -o /tmp/transitive-plan.json

      - name: Collect
        env:
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
        run: |
          set -euo pipefail
          python3 "${LIGHTWELL_SKILLS}/upgrade-transitives/scripts/collect.py" \
            --from-plan /tmp/transitive-plan.json \
            -o /tmp/transitive-collect.json

      - name: Apply
        id: apply
        env:
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
        run: |
          set -euo pipefail
          python3 "${LIGHTWELL_SKILLS}/upgrade-transitives/scripts/apply.py" \
            --from-collect /tmp/transitive-collect.json \
            --include-ask \
            -o /tmp/transitive-apply.json

      - name: Summary
        env:
          LIGHTWELL_USERNAME: ${{ secrets.LIGHTWELL_USERNAME }}
          LIGHTWELL_TOKEN: ${{ secrets.LIGHTWELL_TOKEN }}
        run: |
          set -euo pipefail
          python3 "${LIGHTWELL_SKILLS}/upgrade-transitives/scripts/summary.py" \
            --from-collect /tmp/transitive-collect.json \
            --from-apply /tmp/transitive-apply.json \
            -o /tmp/transitive-summary.md
          cat /tmp/transitive-summary.md

      - name: Show updated pom.xml
        if: always() && steps.apply.outcome == 'success'
        run: cat pom.xml
