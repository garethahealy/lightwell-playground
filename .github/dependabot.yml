# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Mirrors renovate.json Maven updates:
#   schedule:earlyMondays, timezone: Etc/UTC
#   packageRules: disable commons-io and jackson-dataformat-xml
# Lightwell Maven catalogs match the Renovate host rules (not in renovate.json).
version: 2

registries:
  lightwell-remediated:
    type: maven-repository
    url: https://packages.redhat.com/api/pulp-content/public-lightwell-demo/java/remediated
    username: ${{secrets.LIGHTWELL_USERNAME}}
    password: ${{secrets.LIGHTWELL_TOKEN}}
  lightwell-validated:
    type: maven-repository
    url: https://packages.redhat.com/api/pulp-content/public-lightwell-demo/java/validated
    username: ${{secrets.LIGHTWELL_USERNAME}}
    password: ${{secrets.LIGHTWELL_TOKEN}}

updates:
  - package-ecosystem: maven
    directory: /
    registries:
      - lightwell-remediated
      - lightwell-validated
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: scope
    ignore:
      - dependency-name: commons-io:commons-io
      - dependency-name: com.fasterxml.jackson.dataformat:jackson-dataformat-xml
